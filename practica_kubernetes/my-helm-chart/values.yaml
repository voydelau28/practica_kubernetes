app:
  replicaCount: 2

image:
  repository: ghcr.io/ohmyplatform/fastapi-mariadb 
  tag: "main"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: keepcoding-127-0-0-1.nip.io 
  path: /

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 250m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

mariadb:
  image:
    repository: mariadb
    tag: "10.5"
    pullPolicy: IfNotPresent
  auth:
    database: courses_db  # Solo se especifica el nombre de la base de datos
  persistence:
    size: 1Gi
